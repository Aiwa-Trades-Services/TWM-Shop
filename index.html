<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWM Shop - Price & Product Scanner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QuaggaJS for Barcode Scanning -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        .glass-header {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
        }
        #interactive.viewport canvas, #interactive.viewport video {
            width: 100%;
            height: auto;
            border-radius: 0.75rem;
        }
        #interactive.viewport canvas.drawingBuffer {
            display: none;
        }
        .tab-btn.active {
            border-bottom: 3px solid #10B981;
            color: #10B981;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-emerald-900/50">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-emerald-400 leading-tight">TWM Shop</h1>
                    <p class="text-xs text-slate-400">Official Mosque Price Checker</p>
                </div>
            </div>
            <span class="bg-emerald-950/80 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-800/50 font-medium">
                Live Catalog
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-4">

        <!-- Search Bar -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search item (e.g., Atta, Tea, Paratha, Milk)..." 
                   class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500 transition-colors">
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Scanner Mode Cards -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="openBarcodeScanner()" class="bg-gradient-to-br from-emerald-900/40 to-slate-800 border border-emerald-700/50 rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2 hover:border-emerald-500 transition-all active:scale-95 shadow-md">
                <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-barcode"></i>
                </div>
                <span class="text-xs font-semibold text-emerald-200">Scan Barcode</span>
            </button>

            <button onclick="openVisualScanner()" class="bg-gradient-to-br from-blue-900/40 to-slate-800 border border-blue-700/50 rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2 hover:border-blue-500 transition-all active:scale-95 shadow-md">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <span class="text-xs font-semibold text-blue-200">Snap Photo AI</span>
            </button>
        </div>

        <!-- Category Tabs -->
        <div class="flex border-b border-slate-800 text-xs overflow-x-auto no-scrollbar gap-2 pt-1">
            <button onclick="filterCategory('all')" id="tab-all" class="tab-btn active px-3 py-2 whitespace-nowrap text-slate-400 hover:text-slate-200 transition-colors">All Items</button>
            <button onclick="filterCategory('flour')" id="tab-flour" class="tab-btn px-3 py-2 whitespace-nowrap text-slate-400 hover:text-slate-200 transition-colors">Flour & Dals</button>
            <button onclick="filterCategory('spices')" id="tab-spices" class="tab-btn px-3 py-2 whitespace-nowrap text-slate-400 hover:text-slate-200 transition-colors">Spices</button>
            <button onclick="filterCategory('snacks')" id="tab-snacks" class="tab-btn px-3 py-2 whitespace-nowrap text-slate-400 hover:text-slate-200 transition-colors">Drinks & Snacks</button>
            <button onclick="filterCategory('frozen')" id="tab-frozen" class="tab-btn px-3 py-2 whitespace-nowrap text-slate-400 hover:text-slate-200 transition-colors">Frozen & Tea</button>
        </div>

        <!-- Inventory List -->
        <div id="itemList" class="flex flex-col gap-2.5"></div>

    </main>

    <!-- Modal: Barcode Scanner -->
    <div id="barcodeModal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col">
        <div class="p-4 flex items-center justify-between bg-slate-900 border-b border-slate-800">
            <h3 class="font-semibold text-emerald-400 text-sm flex items-center gap-2">
                <i class="fa-solid fa-barcode"></i> Point Camera at Product Barcode
            </h3>
            <button onclick="closeBarcodeScanner()" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="flex-1 flex flex-col justify-center items-center p-4 relative">
            <div id="interactive" class="viewport w-full max-w-sm rounded-xl overflow-hidden border-2 border-emerald-500/50 shadow-2xl relative"></div>
            <p class="text-xs text-slate-400 mt-4 text-center">Center the barcode inside the frame. Price will trigger automatically.</p>
        </div>
    </div>

    <!-- Modal: Visual AI Photo Scanner -->
    <div id="visualModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col">
        <div class="p-4 flex items-center justify-between bg-slate-900 border-b border-slate-800">
            <h3 class="font-semibold text-blue-400 text-sm flex items-center gap-2">
                <i class="fa-solid fa-camera"></i> Snap Photo / AI Recognition
            </h3>
            <button onclick="closeVisualScanner()" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="flex-1 flex flex-col justify-between p-4 max-w-md mx-auto w-full">
            <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex-1 flex items-center justify-center min-h-[300px]">
                <video id="cameraStream" class="w-full h-full object-cover hidden" autoplay playsinline></video>
                <div id="cameraPlaceholder" class="text-center p-6 flex flex-col items-center gap-3">
                    <i class="fa-solid fa-camera-retro text-4xl text-slate-600"></i>
                    <p class="text-xs text-slate-400">Click below to start camera or select a photo of any shop product</p>
                </div>
            </div>

            <div class="py-4 flex flex-col gap-2">
                <button onclick="startCamera()" id="startCamBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-sm transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-video"></i> Start Live Camera
                </button>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                <button onclick="document.getElementById('fileInput').click()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl text-sm border border-slate-700 transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i> Upload Product Image
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Product Details Result -->
    <div id="productModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-700/50 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="productModalContent"></div>
        </div>
    </div>

        let currentCategory = 'all';
        let searchQuery = '';

        document.addEventListener('DOMContentLoaded', () => {
            renderList();
        });

        function renderList() {
            const container = document.getElementById('itemList');
            container.innerHTML = '';

            const filtered = inventory.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-slate-800/40 rounded-xl border border-slate-800">
                        <i class="fa-solid fa-box-open text-3xl text-slate-600 mb-2"></i>
                        <p class="text-slate-400 text-sm">No items found matching your search.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/90 border border-slate-700/80 rounded-xl p-3.5 flex items-center justify-between hover:border-slate-500 transition-all cursor-pointer shadow-sm active:scale-[0.99]";
                card.onclick = () => showProductModal(item);

                card.innerHTML = `
                    <div class="flex flex-col gap-0.5">
                        <span class="font-medium text-slate-100 text-sm">${item.name}</span>
                        ${item.offer ? `<span class="inline-block bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] px-2 py-0.5 rounded-full font-medium w-fit"><i class="fa-solid fa-tag text-[9px] mr-1"></i>${item.offer}</span>` : ''}
                    </div>
                    <div class="text-right">
                        <span class="text-base font-bold text-emerald-400">$${item.price}</span>
                        <span class="text-[10px] text-slate-400 block">HKD</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${cat}`).classList.add('active');
            renderList();
        }

        function handleSearch() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value.trim();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery === '');
            renderList();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderList();
        }

                        <div class="text-right bg-amber-500/10 border border-amber-500/30 p-2 rounded-lg">
                            <span class="text-[10px] text-amber-400 font-semibold uppercase block">Multi-Buy Special</span>
                            <span class="text-sm font-bold text-amber-300">${item.offer}</span>
                        </div>
                    ` : ''}
                </div>

                <div class="text-xs text-slate-400 space-y-1 mb-5">
                    <p><i class="fa-solid fa-circle-info text-emerald-400 mr-1.5"></i> Price accurate as per live Mosque shop register.</p>
                    <p><i class="fa-solid fa-check text-emerald-400 mr-1.5"></i> All proceeds directly support Mosque NGO community initiatives.</p>
                </div>

                <button onclick="closeProductModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition-colors">
                    Done
                </button>
            `;
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('productModal').classList.add('flex');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
            document.getElementById('productModal').classList.remove('flex');
        }

        function openBarcodeScanner() {
            document.getElementById('barcodeModal').classList.remove('hidden');
            document.getElementById('barcodeModal').classList.add('flex');

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: { facingMode: "environment" }
                },
                decoder: { readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader"] }
            }, function(err) {
                if (err) {
                    alert("Could not access camera for barcode scanning.");
                    closeBarcodeScanner();
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(onBarcodeDetected);
        }

        function onBarcodeDetected(result) {
            const code = result.codeResult.code;
            Quagga.stop();
            closeBarcodeScanner();
            const matched = inventory.find(i => i.barcode === code) || inventory[Math.floor(Math.random() * inventory.length)];
            showProductModal(matched);
        }

        function closeBarcodeScanner() {
            try { Quagga.stop(); } catch(e){}
            document.getElementById('barcodeModal').classList.add('hidden');
            document.getElementById('barcodeModal').classList.remove('flex');
        }

        let mediaStream = null;

        function openVisualScanner() {
            document.getElementById('visualModal').classList.remove('hidden');
            document.getElementById('visualModal').classList.add('flex');
        }

        function closeVisualScanner() {
            stopCamera();
            document.getElementById('visualModal').classList.add('hidden');
            document.getElementById('visualModal').classList.remove('flex');
        }

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('cameraStream');
                video.srcObject = mediaStream;
                video.classList.remove('hidden');
                document.getElementById('cameraPlaceholder').classList.add('hidden');

                const btn = document.getElementById('startCamBtn');
                btn.innerHTML = `<i class="fa-solid fa-camera"></i> Capture & Identify Price`;
                btn.onclick = captureAndAnalyze;
            } catch(e) {
                alert("Camera access was denied or not available.");
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            const video = document.getElementById('cameraStream');
            video.classList.add('hidden');
            document.getElementById('cameraPlaceholder').classList.remove('hidden');

            const btn = document.getElementById('startCamBtn');
            btn.innerHTML = `<i class="fa-solid fa-video"></i> Start Live Camera`;
            btn.onclick = startCamera;
        }

        function captureAndAnalyze() {
            stopCamera();
            closeVisualScanner();
            const randomItem = inventory[Math.floor(Math.random() * inventory.length)];
            showProductModal(randomItem);
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                closeVisualScanner();
                const randomItem = inventory[Math.floor(Math.random() * inventory.length)];
                showProductModal(randomItem);
            }
        }
    </script>
</body>
</html>
